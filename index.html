<style>
/* Layout: one narrow exam-paper column; variant list -> question sheet -> marked result */
:root {
  --sea: #d7e7f1; --land: #f7f3ea; --map-border: #9a8f7a; --zone: #3f8a3f; --base: #ecc29c; --base-b: #a8612f; --hatch: #cdbfa5; --mk: #15232d; --mk-t: #ffffff;
  --bg: #f3f5f6;
  --paper: #ffffff;
  --ink: #15232d;
  --muted: #5b6b75;
  --line: #d9e0e4;
  --copper: #a8541f;
  --copper-soft: #f6e7dc;
  --ok: #3f6f2f;
  --ok-soft: #e4efdc;
  --bad: #a83232;
  --bad-soft: #f6e0e0;
  --warn: #8a6510;
  --warn-soft: #f7edd2;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --paper: #16222a; --ink: #e6ecef; --muted: #93a3ad; --line: #2a3a44;
    --copper: #e08a52; --copper-soft: #3a2619; --ok: #8cc475; --ok-soft: #1f3319;
    --bad: #ef8a8a; --bad-soft: #3d1d1d; --warn: #e3bd5c; --warn-soft: #3a2f12; color-scheme: dark;
    --sea: #10202b; --land: #2a3640; --map-border: #6d7c86; --zone: #5fb05f; --base: #7a4f2c; --base-b: #d08a50; --hatch: #45535d; --mk: #e6ecef; --mk-t: #0f171c;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --paper: #16222a; --ink: #e6ecef; --muted: #93a3ad; --line: #2a3a44;
  --copper: #e08a52; --copper-soft: #3a2619; --ok: #8cc475; --ok-soft: #1f3319;
  --bad: #ef8a8a; --bad-soft: #3d1d1d; --warn: #e3bd5c; --warn-soft: #3a2f12; color-scheme: dark;
    --sea: #10202b; --land: #2a3640; --map-border: #6d7c86; --zone: #5fb05f; --base: #7a4f2c; --base-b: #d08a50; --hatch: #45535d; --mk: #e6ecef; --mk-t: #0f171c;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.15; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 700; }
.muted { color: var(--muted); }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn:hover { border-color: var(--copper); }
.btn.primary { background: var(--copper); border-color: var(--copper); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }

/* header */
.head { display: grid; gap: 14px; margin-bottom: 28px; }
.dates { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: .9rem; }
.chip b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
a.chip { color: var(--copper); text-decoration: none; font-weight: 600; }
a.chip:hover { border-color: var(--copper); }
.chip.alert { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.rules { font-size: .92rem; color: var(--muted); margin: 0; }

/* settings */
.settings { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; margin-bottom: 18px; font-size: .93rem; }
.settings label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.settings input { accent-color: var(--copper); width: 18px; height: 18px; }

/* variant list */
.list { display: grid; gap: 10px; }
.var { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; text-align: left; width: 100%; padding: 14px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.var:hover { border-color: var(--copper); }
.var .t { font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; min-width: 0; }
.var .s { grid-column: 1; font-size: .85rem; color: var(--muted); min-width: 0; }
.var .r { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: .85rem; color: var(--muted); }
.var .r b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 1.05rem; color: var(--ink); }
.var.feature { border-color: var(--copper); background: var(--copper-soft); }
.sect { margin: 26px 0 10px; }

/* quiz */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; display: grid; gap: 10px; }
.bar-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
.timer { font-family: var(--f-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 5px; }
.dot { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); font: 500 .78rem var(--f-mono); color: var(--muted); }
.dot.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot.cur { outline: 2px solid var(--copper); outline-offset: 1px; }
.dot.r-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.dot.r-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; display: grid; gap: 16px; }
.qnum { font-family: var(--f-mono); color: var(--copper); font-size: .9rem; }
.qtext { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.4; font-weight: 500; }
.ru { font-size: .95rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.link { background: none; border: 0; padding: 0; color: var(--copper); text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; justify-self: start; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
.opt:hover:not(:disabled):not([aria-disabled]) { border-color: var(--copper); }
.opt .l { font-family: var(--f-display); font-weight: 700; color: var(--muted); }
.opt span:last-child { min-width: 0; }
.otr { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }
.speak { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: .88rem; font-weight: 600; justify-self: start; }
.speak:hover { border-color: var(--copper); }
.speak svg { width: 16px; height: 16px; fill: currentColor; }
.qtools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.lis { display: grid; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.lis .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.lis select, .lis input[type=range] { font: inherit; accent-color: var(--copper); }
.lis select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); max-width: 100%; }
.lis .now { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; min-height: 120px; }
.lis .ans { color: var(--ok); font-weight: 600; }
.opt.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt.sel .l { color: var(--ink); }
.opt.right { background: var(--ok-soft); border: 2px solid var(--ok); }
.opt.wrong { background: var(--bad-soft); border: 2px solid var(--bad); }
.opt.right .l, .opt.wrong .l { color: var(--paper); border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: .85rem; }
.opt.right .l { background: var(--ok); }
.opt.wrong .l { background: var(--bad); }
.verdict-line { font-weight: 600; padding: 10px 12px; border-radius: 8px; }
.verdict-line.ok { background: var(--ok-soft); color: var(--ok); }
.verdict-line.bad { background: var(--bad-soft); color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 6px 12px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--copper); color: var(--paper); }
.qaudio { width: 100%; height: 40px; }
.cymap { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); display: block; }
.cymap .mk circle { fill: var(--mk); stroke: var(--paper); stroke-width: 3; }
.cymap .mk text { fill: var(--mk-t); font: 700 30px var(--f-display); }
.cymap .mk.ok circle { fill: var(--ok); }
.cymap .mk.bad circle { fill: var(--bad); }
.map-opts { grid-template-columns: repeat(4, 1fr); }
.map-opts .opt { grid-template-columns: 1fr; justify-items: center; padding: 10px 6px; gap: 2px; }
.map-opts .opt .l { min-height: 0; }
.map-opts .big { font: 700 1.5rem var(--f-display); }
.btn.small { padding: 6px 12px; font-size: .88rem; }
.progress { align-self: center; font-size: .88rem; }
.dict-t { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.dict-t.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.gw { text-decoration: underline dotted var(--copper); text-underline-offset: 4px; cursor: help; border-radius: 3px; }
.gw:hover, .gw:focus-visible { background: var(--copper-soft); outline: none; }
.gpop { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 16px)); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 8px 12px; font-size: .9rem; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.25); display: grid; gap: 2px; }
.gpop b { font-family: var(--f-display); }
.opt[aria-disabled] { cursor: default; }
.mode-hint { font-size: .85rem; color: var(--muted); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.mode { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; cursor: pointer; }
.mode input { accent-color: var(--copper); width: 16px; height: 16px; }
.note { font-size: .9rem; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.note b { color: var(--warn); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.nav .grow { flex: 1; }

/* result */
.score { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; padding: 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; }
.big { font-family: var(--f-display); font-size: 3.2rem; font-weight: 700; line-height: 1; grid-row: span 2; font-variant-numeric: tabular-nums; }
.verdict { font-weight: 600; padding: 4px 10px; border-radius: 6px; justify-self: start; }
.v-ok { background: var(--ok-soft); color: var(--ok); }
.v-mid { background: var(--warn-soft); color: var(--warn); }
.v-bad { background: var(--bad-soft); color: var(--bad); }
.scale { position: relative; height: 10px; border-radius: 5px; background: var(--line); margin: 6px 0 22px; }
.scale .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--ink); }
.scale .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--copper); }
.scale .mk span { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font: .72rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.review { display: grid; gap: 10px; }
.rv { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; font-size: .94rem; }
.rv.bad { border-left-color: var(--bad); }
.rv .q { font-family: var(--f-display); font-weight: 500; }
.rv .yours { color: var(--bad); }
.rv .corr { color: var(--ok); font-weight: 600; }
.filter { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter .btn.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tips { display: grid; gap: 8px; }
.tips details { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.tips summary { cursor: pointer; padding: 13px 16px; font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.tips summary::-webkit-details-marker { display: none; }
.tips summary::after { content: "+"; color: var(--copper); font-family: var(--f-mono); }
.tips details[open] summary::after { content: "−"; }
.tips .body { padding: 0 16px 16px; display: grid; gap: 10px; font-size: .95rem; }
.tips ul, .tips ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.tips table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tips td, .tips th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.tips th { font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
.tips .scroll { overflow-x: auto; }
.tips a { color: var(--copper); }
.gr { font-family: var(--f-display); font-weight: 500; }
.foot { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); display: grid; gap: 8px; }
.foot a { color: var(--copper); }
@media (max-width: 480px) { h1 { font-size: 1.55rem; } .qtext { font-size: 1.15rem; } .big { font-size: 2.5rem; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: .6; } } }
</style>

  function setupListen() {
    const sel = document.getElementById('l-var'), au = document.getElementById('l-audio');

    };

  function start(id) {
    let qs, name;
    if (id === 'rnd') { qs = shuffle(ALL).slice(0, 25); name = 'Пройти тест: случайные'; }
    else if (id === 'miss') { const m = store.get('miss', {}); qs = ALL.filter(q => m[keyOf(q)]); qs = shuffle(qs).slice(0, 25); name = 'Мои ошибки'; }
    else { const v = VARIANTS.find(x => x.id === id); qs = v.qs.map((q, k) => ({ ...q, from: v.name, clip: clipOf(v, k) })); name = v.name; }
    qs = qs.map(q => {
      const opts = [q.a, ...q.w];
      const tf = opts.every(o => o === 'σωστό' || o === 'λάθος');
      return { ...q, opts: q.map ? ['Α', 'Β', 'Γ', 'Δ'] : tf ? ['σωστό', 'λάθος'] : shuffle(opts) };
    });
    S = { id, name, qs, ans: Array(qs.length).fill(null), i: 0, showRu: {}, peek: {}, done: false, end: Date.now() + 45 * 60e3 };
    clearInterval(tick);
    if (settings.timer) tick = setInterval(updTimer, 1000);
    quiz();
  }

  function updTimer() {
    const el = document.getElementById('timer'); if (!S || S.done) return;
    const left = Math.max(0, Math.round((S.end - Date.now()) / 1000));
    if (el) { el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); el.classList.toggle('low', left < 300); }
    if (left === 0) finish();
  }

        }).join('')}</div>
        ${peek ? `<div class="verdict-line ok">Правильный ответ: ${ansText(q)}</div>` : reveal ? (a === q.a ? `<div class="verdict-line ok">✓ Верно${q.map ? ': ' + ansText(q) : ''}</div>` : `<div class="verdict-line bad">✗ Неверно. Правильный ответ: ${ansText(q)}${q.map && q.places ? '. Вы выбрали ' + a + ' — ' + q.places[a] : ''}</div>`) : ''}
        ${reveal && q.n ? `<div class="note"><b>Пометка:</b> ${esc(q.n)}</div>` : ''}
      </article>
      <div class="nav">
        <button class="btn" id="prev" ${S.i === 0 ? 'disabled' : ''}>← Назад</button>
        <span class="grow"></span>
        <span class="muted progress">Отвечено ${S.ans.filter(x => x != null).length} из ${n}</span>
        ${allDone ? `<button class="btn primary" id="fin">Результат →</button>` : S.i < n - 1 ? `<button class="btn" id="next">Дальше →</button>` : `<button class="btn" id="next">К неотвеченному →</button>`}
      </div>`;
    updTimer();
    document.getElementById('back').onclick = () => { stopAudio(); home(); };
    const tr =document.getElementById('tr'); if (tr) tr.onclick = () => { S.showRu[S.i] = true; quiz(); };
    const qa = app.querySelector('.qaudio'); if (qa) qa.onplay = () => { try { player.pause(); } catch (e) {} };
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.i = +b.dataset.go; quiz(); });
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = e => {
      if (settings.dict && e.target.closest('.gw')) return;
      if (b.getAttribute('aria-disabled')) return;
      S.ans[S.i] = q.opts[+b.dataset.o];
      const left = S.qs.map((_, k) => k).filter(k => S.ans[k] == null && !S.peek[k]);
      if (!left.length && !settings.study) return finish();
      if (!settings.study && left.length) S.i = left.find(k => k > S.i) ?? left[0];
      quiz();
    });
    const dt = document.getElementById('dict'); if (dt) dt.onclick = () => { settings.dict = !settings.dict; store.set('settings', settings); hidePop(); quiz(); };
    app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { settings.study = b.dataset.mode === 'study'; store.set('settings', settings); quiz(); });
    const pk = document.getElementById('peek'); if (pk) pk.onclick = () => { S.peek[S.i] = true; quiz(); };
    const nextLeft = () => { const left = S.qs.map((_, k) => k).filter(k => !done(k)); return left.find(k => k > S.i) ?? left[0]; };
    document.getElementById('prev').onclick = () => { S.i--; quiz(); };
    const nx = document.getElementById('next'); if (nx) nx.onclick = () => { S.i = S.i < n - 1 ? S.i + 1 : nextLeft(); quiz(); };
    const fb = document.getElementById('fin'); if (fb) fb.onclick = finish;
  }

  function finish() {
    clearInterval(tick); S.done = true;
    const n = S.qs.length;
    const ok = S.qs.filter((q, k) => S.ans[k] === q.a).length;
    const pct = Math.round(ok / n * 100);
    const miss = store.get('miss', {});
    S.qs.forEach((q, k) => { if (S.ans[k] === q.a) delete miss[keyOf(q)]; else miss[keyOf(q)] = 1; });
    store.set('miss', miss);
    if (S.id !== 'miss') { const best = store.get('best', {}); if (best[S.id] == null || ok > best[S.id]) best[S.id] = ok; store.set('best', best); }
    const [vc, vt] = pct >= 60 ? ['v-ok', 'Сдано: хватает для гражданства'] : pct >= 50 ? ['v-mid', 'Хватает для статуса долгосрочного резидента; для гражданства нужно 60%'] : ['v-bad', 'Не сдано'];
    let filt = 'bad';
    const draw = () => {
      const rows = S.qs.map((q, k) => ({ q, k, good: S.ans[k] === q.a })).filter(r => filt === 'all' || !r.good);
      document.getElementById('rv').innerHTML = rows.length ? rows.map(({ q, k, good }) => `
        <div class="rv ${good ? '' : 'bad'}">
          <div class="muted" style="font-size:.8rem">${k + 1}${q.from ? ' · ' + esc(q.from) : ''}</div>
          <div class="q" lang="el">${esc(q.q)}</div>
          ${q.ru ? `<div class="muted">${esc(q.ru)}</div>` : ''}
          ${good ? '' : `<div class="yours">Ваш ответ: ${S.ans[k] == null ? '—' : esc(S.ans[k]) + (trOpt(S.ans[k]) ? ' (' + esc(trOpt(S.ans[k])) + ')' : '')}</div>`}
          <div class="corr">Верно: ${esc(q.a)}${trOpt(q.a) && trOpt(q.a) !== q.a ? ' (' + esc(trOpt(q.a)) + ')' : ''}</div>
          ${q.n ? `<div class="note"><b>Пометка:</b> ${esc(q.n)}</div>` : ''}
        </div>`).join('') : '<p class="muted">Ошибок нет.</p>';
      app.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === filt));
    };
    app.innerHTML = `
      <div class="bar"><div class="bar-top"><button class="btn" id="back">← Варианты</button><strong>${esc(S.name)}</strong><span></span></div></div>
      <section class="score">
        <div class="big">${ok}/${n}</div>
        <div><span class="verdict ${vc}">${vt}</span></div>
        <div class="muted">${pct}% правильных</div>
      </section>
      <div class="scale" aria-hidden="true"><div class="fill" style="width:${pct}%"></div>
        <div class="mk" style="left:50%"><span>50% резидент</span></div><div class="mk" style="left:60%"><span>60% гражданство</span></div></div>
      <div class="nav" style="margin:0 0 16px"><button class="btn primary" id="again">Пройти снова</button><button class="btn" id="rnd">Пройти тест: случайные</button></div>
      <div class="filter"><button class="btn" data-f="bad">Ошибки (${n - ok})</button><button class="btn" data-f="all">Все вопросы</button></div>
      <div class="review" id="rv"></div>`;
    document.getElementById('back').onclick = home;
    document.getElementById('again').onclick = () => start(S.id);
    document.getElementById('rnd').onclick = () => start('rnd');
    app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filt = b.dataset.f; draw(); });
    draw();
    window.scrollTo(0, 0);
  }

  home();
})();
</script>

</body>
</html>
